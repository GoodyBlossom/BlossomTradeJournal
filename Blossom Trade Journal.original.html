<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blossom Trade Journal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0b1f3a;--mu:#6b7a90;--bd:#e2e8f0;--ac:#0b1f3a;--on:#fff;--g:#16a34a;--r:#dc2626;--in:#f8fafc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060b17;--card:#0c1530;--tx:#eef2fa;--mu:#8a98b4;--bd:#1a2644;--ac:#e8b4a6;--on:#1a1020;--g:#5fd3a0;--r:#f2808a;--in:#09112a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060b17;--card:#0c1530;--tx:#eef2fa;--mu:#8a98b4;--bd:#1a2644;--ac:#e8b4a6;--on:#1a1020;--g:#5fd3a0;--r:#f2808a;--in:#09112a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 420px at 85% -5%,color-mix(in srgb,var(--ac) 10%,transparent),transparent),var(--bg);color:var(--tx);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#app{display:flex;min-height:100vh}
nav{width:210px;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;box-sizing:border-box;flex:none}
nav h1{font:600 20px/1.25 "Playfair Display",Georgia,serif;margin:8px 10px 20px;color:var(--ac)}
nav a{display:block;padding:10px 14px;border-radius:10px;color:var(--mu);cursor:pointer;font-weight:500;margin-bottom:2px}
nav a.on{background:var(--ac);color:var(--on)}
main{flex:1;min-width:0;padding:32px 28px;max-width:1040px;margin:0 auto;box-sizing:border-box}
@media(max-width:820px){#app{display:block}nav{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);border-right:0;z-index:5}nav h1{display:none}nav a{white-space:nowrap;padding:8px 12px;font-size:13px}main{padding:14px 14px 90px}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 14px 34px -22px rgba(0,0,0,.55)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}.g .c{margin:0}
.k small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.09em}.k b{font-size:25px;font-weight:600}
.pos{color:var(--g)}.neg{color:var(--r)}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g)}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);font:inherit}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
button{padding:9px 18px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:600;cursor:pointer;transition:filter .15s}button:hover{filter:brightness(1.08)}
button.s{background:var(--in);color:var(--tx);border:1px solid var(--bd)}
.mic{float:right;padding:1px 8px;font-size:12px}.mic.on{background:var(--r);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}.row>*{flex:1 1 130px}.row.n{justify-content:center;align-items:center}.row.n>*{flex:none}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.chip{display:inline-block;padding:4px 11px;border:1px solid var(--bd);border-radius:99px;margin:0 6px 6px 0;cursor:pointer;font-size:13px}.chip.on{background:var(--ac);color:var(--on)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.d{min-height:58px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:12px;cursor:pointer}
.d.w{background:color-mix(in srgb,var(--g) 25%,var(--card))}.d.l{background:color-mix(in srgb,var(--r) 25%,var(--card))}.d.b{background:var(--bd)}.d.m{border-style:dashed}.we{opacity:.55}.td{outline:2px solid var(--ac)}
h2{font:600 30px/1.2 "Playfair Display",Georgia,serif;font-variant-numeric:lining-nums;letter-spacing:-.01em;margin:0 0 6px}
</style></head><body><div id="app"><nav id="nv"></nav><main id="mn">Loading…</main></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
td=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
f=n=>(n<0?'−':'')+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','),
g=(o,p)=>p.split('.').reduce((a,q)=>a?.[q],o)??'',
setp=(o,p,v)=>{const a=p.split('.'),l=a.pop();for(const q of a)o=o[q]??={};o[l]=v},
say=t=>{const s=$('#st');if(s)s.textContent=t};
const DR=[['do','Follow my trading strategy'],['do','Respect my risk management'],['do','Set my stop loss'],['dont','Revenge trade'],['dont','Overtrade'],['dont','Exceed my daily loss limit']].map(([t,x],i)=>({id:'d'+i,t,x})),
NEG=['Fearful','Anxious','Greedy','Frustrated'],TG=['Confident','Calm','Patient','Disciplined',...NEG],SS=['Sydney','Tokyo','London','New York'],CATS=['General','Lesson','Reminder','Strategy'],
FL=[['fomo','Did I experience FOMO?'],['rev','Did I revenge trade?'],['over','Did I overtrade?'],['fear','Did I close a trade out of fear?'],['plan','Did I follow my plan despite my emotions?']],
FN={fomo:'FOMO entries',rev:'Revenge trading',over:'Overtrading',fear:'Closing out of fear'},
RV=[['well','What did I do well today?'],['mist','What mistakes did I make?'],['learn','What did I learn today?'],['plan','Did I follow my trading plan?'],['emo','Did I manage my emotions?'],['pat','Was I patient?'],['diff','What would I do differently tomorrow?'],['take','Biggest takeaway from today'],['act','Action point for tomorrow']],
NAV=[['dash','▦ Dashboard'],['jr','✎ Daily Journal'],['hist','☰ Trade History'],['rules','✔ Trading Rules'],['cal','▤ Calendar'],['an','◔ Monthly Analytics'],['gr','↗ Trading Growth'],['notes','✐ Notes'],['set','⚙ Settings']];
let S={set:{tg:100,ml:50,cur:'USD',mt:5},rules:DR,days:{},notes:[],th:''},view='dash',cd=td(),mo=td().slice(0,7),flt={},draft={},db,ref,dic,dl,mic,lis,tm;
const K=(l,v,c='')=>`<div class="c k"><small>${l}</small><b class="${c}">${v}</b></div>`,
H=t=>`<div class="row"><h2 style="margin:0;flex:3 1 200px">${t}</h2><span id="st" class="mu" style="text-align:right"></span></div>`,
SEL=(k,o,v,at='k')=>`<select data-${at}="${k}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${a}"${a==v?' selected':''}>${b}</option>`}).join('')}</select>`,
L=(l,h)=>`<div><label>${l}</label>${h}</div>`,
YN=(k,v)=>SEL(k,[['','–'],['y','Yes'],['n','No']],v),
F=(k,l,v,o={})=>`<div><label>${l}${o.m&&dic?`<button class="mic s" data-m="${k}" title="Dictate">🎤</button>`:''}</label>${o.ta?`<textarea rows="${o.r||2}" data-k="${k}">${e(v)}</textarea>`:`<input data-k="${k}" type="${o.t||'text'}" value="${e(v)}">`}</div>`,
CH=(k,a,sel)=>a.map(v=>`<span class="chip${(sel||[]).includes(v)?' on':''}" data-a="chip" data-k="${k}" data-v="${v}">${v}</span>`).join(''),
MN=()=>`<div class="row n"><button class="s" data-a="mon" data-v="-1">‹</button><b>${new Date(mo+'-01T00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="s" data-a="mon" data-v="1">›</button></div>`;
const day=k=>{const d=S.days[k]??={trades:[],emo:{},rv:{},rc:{}};delete d.s;return d};
function ds(k){const d=S.days[k]||{},T=d.trades||[],s=S.set,pr=T.reduce((a,t)=>a+Math.max(+t.pl||0,0),0),lo=-T.reduce((a,t)=>a+Math.min(+t.pl||0,0),0),em=d.emo||{},R=S.rules.map(r=>d.rc?.[r.id]?.v).filter(v=>v=='1'||v=='0'),ad=R.length?Math.round(100*R.filter(v=>v=='1').length/R.length):null,fl=['fomo','rev','over','fear'].filter(z=>em[z]=='y').length,br=s.ml>0&&lo>s.ml,ac=T.length||R.length||fl;
return{d,T,n:T.length,w:T.filter(t=>t.out=='Win').length,l:T.filter(t=>t.out=='Loss').length,pr,lo,net:pr-lo,ad,fl,br,mx:s.mt>0&&T.length>s.mt,sc:ac?Math.max(0,(ad??100)-10*fl-(br?20:0)):null}}
function ms(ym){const X=Object.keys(S.days).filter(k=>k.startsWith(ym)).sort().map(k=>({k,...ds(k)})),TD=X.filter(x=>x.n),A=X.flatMap(x=>x.T),c=o=>A.filter(t=>t.out==o).length,
cnt=a=>{const o={};a.forEach(z=>o[z]=(o[z]||0)+1);return Object.entries(o).sort((p,q)=>q[1]-p[1])},P=(a,b)=>b?Math.round(100*a/b):null,sum=k=>X.reduce((a,x)=>a+x[k],0),sc=X.filter(x=>x.sc!=null),em=x=>x.d.emo||{},[y,mm]=ym.split('-').map(Number);let wd=0;
for(let i=1,n=new Date(y,mm,0).getDate();i<=n;i++){const t=new Date(y,mm-1,i);if(t<=new Date()&&t.getDay()%6)wd++}
return{X,TD,n:A.length,w:c('Win'),l:c('Loss'),b:c('Breakeven'),pr:sum('pr'),lo:sum('lo'),net:sum('net'),pd:TD.filter(x=>x.net>0).length,ld:TD.filter(x=>x.net<0).length,
best:TD.length?TD.reduce((a,b)=>b.net>a.net?b:a):null,worst:TD.length?TD.reduce((a,b)=>b.net<a.net?b:a):null,avg:TD.length?sum('net')/TD.length:0,
plan:X.filter(x=>x.ad>=80).length,pa:X.filter(x=>x.ad!=null).length,disc:sc.length?Math.round(sc.reduce((a,x)=>a+x.sc,0)/sc.length):null,
emo:cnt(X.flatMap(x=>em(x).tags||[])),mis:cnt([...X.flatMap(x=>['fomo','rev','over','fear'].filter(z=>em(x)[z]=='y').map(z=>FN[z])),...X.flatMap(x=>S.rules.filter(r=>x.d.rc?.[r.id]?.v=='0').map(r=>'Broke rule: '+r.x))]),
emn:P(X.filter(x=>em(x).plan=='y').length,X.filter(x=>em(x).plan).length),pat:P(X.filter(x=>em(x).over!='y'&&em(x).fomo!='y').length,X.length),str:P(A.filter(t=>t.fol=='Yes').length,A.length),
risk:P(TD.filter(x=>!x.br&&!x.mx).length,TD.length),jc:wd?Math.min(100,P(X.length,wd)):null,imp:X.length?+(X.reduce((a,x)=>a+x.fl,0)/X.length).toFixed(2):null}}
function chart(v,bar){if(!v.length)return'<p class="mu">No trades recorded for this period.</p>';const W=300,Q=110,mn=Math.min(0,...v),mx=Math.max(0,...v),sp=(mx-mn)||1,y=a=>Q-8-(a-mn)/sp*(Q-16),n=v.length;
let b=`<svg viewBox="0 0 ${W} ${Q}" style="width:100%;height:auto"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--bd)"/>`;
if(bar)v.forEach((a,i)=>b+=`<rect x="${8+i*(W-16)/n}" y="${Math.min(y(a),y(0))}" width="${(W-16)/n*.7}" height="${Math.max(1,Math.abs(y(a)-y(0)))}" rx="2" style="fill:var(--${a<0?'r':'g'})"/>`);
else b+=`<polyline fill="none" style="stroke:var(--ac);stroke-width:2" points="${v.map((a,i)=>(n<2?W/2:8+i*(W-16)/(n-1))+','+y(a)).join(' ')}"/>`;
return b+`</svg><div class="mu">Range ${f(mn)} to ${f(mx)}</div>`}
const V={
dash(){const k=td(),x=ds(k),s=S.set,pct=s.tg>0?Math.min(100,Math.max(0,x.net)/s.tg*100):0,lp=s.ml>0?Math.min(100,x.lo/s.ml*100):0,ser=[];let t=0;
for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);t+=ds(td(d)).net;ser.push(t)}
return H('Dashboard')+`<p class="mu">${new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})} · amounts in ${e(s.cur)}</p>`
+(Object.keys(S.days).length?'':`<div class="c">Nothing recorded yet. <button data-a="mk">Load sample data</button> <button class="s" data-a="nav" data-v="jr">Start today’s journal</button></div>`)
+`<div class="g">${K('Trades today',x.n)}${K('Wins',x.w,'pos')}${K('Losses',x.l,'neg')}${K('Profit',f(x.pr),'pos')}${K('Loss',f(x.lo),'neg')}${K('Net',f(x.net),x.net<0?'neg':'pos')}</div>
<div class="c"><b>Daily profit target</b> · ${f(s.tg)}<div class="bar"><i style="width:${pct}%"></i></div>${pct.toFixed(0)}% achieved · ${x.net>=s.tg&&s.tg>0?'<b class="pos">Target reached ✓</b>':'not reached yet'}</div>
<div class="c"><b>Daily loss limit</b> · ${f(s.ml)}<div class="bar"><i style="width:${lp}%;background:var(--r)"></i></div>${x.br?'<b class="neg">Limit breached ✗</b>':'Respected ✓'}${x.mx?` · <b class="neg">Exceeded ${s.mt}-trade maximum</b>`:''}</div>
<div class="g">${K('Discipline score',x.sc==null?'–':x.sc+'/100')}${K('Plan adherence',x.ad==null?'–':x.ad+'%')}</div>
<div class="c"><b>Cumulative P/L, last 30 days</b>${chart(ser)}</div>`},
jr(){const k=cd,d=S.days[k]||{},T=d.trades||[],em=d.emo||{},rc=d.rc||{},x=ds(k),s=S.set,v=p=>g(d,p);
return H('Daily Journal')+`<div class="row"><input id="jd" type="date" value="${k}"><button data-a="save" style="flex:none">Save entry</button></div>${dic?'':'<p class="mu">Voice input isn’t available in this browser — typing works everywhere.</p>'}
<div class="c row n" style="justify-content:flex-start;gap:18px"><span>Net <b class="${x.net<0?'neg':'pos'}">${f(x.net)} ${e(s.cur)}</b></span><span>Trades <b>${x.n}</b></span><span>Plan <b>${x.ad==null?'–':x.ad+'%'}</b></span><span>Discipline <b>${x.sc??'–'}</b></span><span>${x.net>=s.tg&&s.tg>0?'🎯 target hit':'target not hit'}</span><span>${x.br?'⚠ loss limit breached':'loss limit OK'}</span></div>
<div class="c"><b>Today</b>${F('act','What did I do today?',v('act'),{ta:1,m:1})}<label>Sessions</label>${CH('sess',SS,d.sess)}${F('obs','Market observations',v('obs'),{ta:1,m:1})}</div>
<div class="c"><b>Trades (${x.n})</b><div class="tbl"><table>${T.map((t,i)=>`<tr><td>${e(t.p)}<td>${t.s}<td>${t.out}<td class="${t.pl<0?'neg':t.pl>0?'pos':''}">${f(+t.pl)}<td>${t.pips?e(t.pips)+' pips':''}<td>${t.fol}<td><a data-a="deltrade" data-v="${i}" style="cursor:pointer">✕</a>`).join('')}</table></div>
<p><b>Add a trade</b> <span class="mu">— enter the amount as a positive number; the outcome sets the sign.</span></p>
<div class="row">${F('t.p','Pair',draft.p||'')}${L('Side',SEL('t.s',['Buy','Sell'],draft.s))}${L('Outcome',SEL('t.out',['Win','Loss','Breakeven'],draft.out))}${F('t.a','Amount',draft.a||'',{t:'number'})}${F('t.pips','Pips (optional)',draft.pips||'')}${L('Followed my strategy?',SEL('t.fol',['Yes','Partly','No'],draft.fol))}</div>
${F('t.why','Why I entered, how it went, and what I could do better',draft.why||'',{ta:1,m:1,r:4})}<p><button data-a="addtrade">Add trade</button></p></div>
<div class="c"><b>Emotions</b><label>How I felt</label>${CH('emo.tags',TG,em.tags)}<div class="row">${FL.map(([a,b])=>L(b,YN('emo.'+a,em[a]))).join('')}</div>${F('emo.note','Additional reflections',v('emo.note'),{ta:1,m:1})}</div>
<div class="c"><b>Rule check</b> <span class="mu">Leave “N/A” for rules that didn’t apply today.</span>${S.rules.map(r=>{const c=rc[r.id]||{};return`<div class="row" style="align-items:center"><div style="flex:2 1 220px">${r.t=='do'?'✅':'⛔'} ${e(r.x)}</div>${L('',SEL('rc.'+r.id+'.v',[['','N/A'],['1','Followed'],['0','Broke it']],c.v||''))}${c.v=='0'?`<div style="flex:3 1 200px"><input data-k="rc.${r.id}.why" placeholder="Why did I break it?" value="${e(c.why||'')}"></div>`:''}</div>`}).join('')}</div>
<div class="c"><b>End-of-day review</b>${F('rv.text','How did today go? What went well, what did I learn, what’s my plan for tomorrow?',v('rv.text'),{ta:1,m:1,r:5})}${L('If I had to grade today’s trading (1–10)',SEL('rv.grade',[['','–'],...Array.from({length:10},(_,i)=>i+1)],v('rv.grade')))}</div>`},
hist(){return H('Trade History')+`<div class="c"><div class="row"><input data-f="q" placeholder="Search entries" value="${e(flt.q||'')}"><input data-f="p" placeholder="Pair, e.g. EURUSD" value="${e(flt.p||'')}"><input data-f="dt" type="date" value="${flt.dt||''}">${SEL('o',[['','Any outcome'],'Win','Loss','Breakeven'],flt.o||'','f')}${SEL('m',[['','Any emotion'],...TG],flt.m||'','f')}</div>${dl?'<div class="row n"><button class="s" data-a="csv" data-v="t">Export trades CSV</button><button class="s" data-a="csv" data-v="j">Export journal CSV</button></div>':''}</div><div id="res"></div>`},
rules(){const col=t=>`<div class="c"><b>${t=='do'?'✅ Things I MUST DO':'⛔ Things I MUST NOT DO'}</b><div style="margin-top:8px">${S.rules.filter(r=>r.t==t).map(r=>`<div class="row" style="flex-wrap:nowrap"><input data-r="${r.id}" value="${e(r.x)}"><button class="s" style="flex:none" data-a="delrule" data-v="${r.id}">✕</button></div>`).join('')}</div><div class="row" style="flex-wrap:nowrap"><input id="nr-${t}" placeholder="Add a rule"><button style="flex:none" data-a="addrule" data-v="${t}">Add</button></div></div>`;
return H('My Trading Rules')+'<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">'+col('do')+col('dont')+'</div>'},
cal(){const[y,m]=mo.split('-').map(Number),nd=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7,t=td();
let h=H('Calendar')+MN()+'<div class="c"><div class="cal">'+'MTWTFSS'.split('').map(c=>`<small class="mu" style="text-align:center">${c}</small>`).join('')+'<i></i>'.repeat(off);
for(let i=1;i<=nd;i++){const k=mo+'-'+String(i).padStart(2,'0'),x=ds(k),wk=new Date(y,m-1,i).getDay()%6,ex=S.days[k],c=x.n?(x.net>0?'w':x.net<0?'l':'b'):ex?'':(wk&&k<t?'m':'');
h+=`<div class="d ${c}${wk?'':' we'}${k==t?' td':''}" data-a="open" data-v="${k}">${i}${x.n?`<br><b class="${x.net<0?'neg':'pos'}">${f(x.net)}</b>`:''}${x.n&&!ex.rv?.grade?' ⚠':''}</div>`}
return h+'</div><p class="mu">Green = profit · red = loss · grey = breakeven · plain = journaled, no trades · dashed = no journal · ⚠ = review unfinished</p></div>'},
an(){const m=ms(mo);let t=0;const bd=z=>z?z.k.slice(8)+' · '+f(z.net):'–';
return H('Monthly Performance')+MN()+`<div class="g">${K('Trades',m.n)}${K('Wins',m.w,'pos')}${K('Losses',m.l,'neg')}${K('Breakeven',m.b)}${K('Win rate',m.n?(100*m.w/m.n).toFixed(1)+'%':'–')}${K('Total profit',f(m.pr),'pos')}${K('Total loss',f(m.lo),'neg')}${K('Net',f(m.net),m.net<0?'neg':'pos')}${K('Profitable days',m.pd)}${K('Losing days',m.ld)}${K('Best day',bd(m.best))}${K('Worst day',bd(m.worst))}${K('Avg per trading day',f(m.avg))}${K('Plan respected (80%+)',m.plan+' of '+m.pa+' days')}${K('Avg discipline',m.disc??'–')}${K('Top emotion',m.emo[0]?.[0]||'–')}</div>
<div class="c"><b>Cumulative P/L</b>${chart(m.TD.map(x=>t+=x.net))}</div><div class="c"><b>Daily P/L</b>${chart(m.TD.map(x=>x.net),1)}</div>
<div class="c"><b>Emotions</b><br>${m.emo.map(([k,c])=>`<span class="chip">${k} ×${c}</span>`).join('')||'<span class="mu">None tagged.</span>'}<br><br><b>Most frequent mistakes</b><br>${m.mis.slice(0,8).map(([k,c])=>`<span class="chip">${e(k)} ×${c}</span>`).join('')||'<span class="mu">None recorded.</span>'}</div>`},

async function write(){const j=JSON.stringify(S);try{if(ref)await ref.set({j});else localStorage.setItem('tj',j);say('Saved ✓')}catch(x){say('Could not save: '+(x.message||x.code||'error'))}}

for(let i=1;i<=28;i++){const dt=new Date();dt.setDate(dt.getDate()-i);const k=td(dt);if(!(dt.getDay()%6)||S.days[k]||r(10)<1)continue;const bad=r(10)<3,T=[];
