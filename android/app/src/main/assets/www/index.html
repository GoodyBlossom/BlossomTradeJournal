<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070c18">
  <title>Blossom Trade Journal 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg: #070c18;
      --card: #0f192f;
      --card-elevated: #15223e;
      --card-border: rgba(255, 255, 255, 0.08);
      --tx: #f8fafc;
      --tx-muted: #8e9db5;
      --tx-dim: #5c6b82;
      --accent: #fb7185;
      --accent-glow: rgba(251, 113, 133, 0.3);
      --accent-grad: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
      --g: #10b981;
      --g-bg: rgba(16, 185, 129, 0.12);
      --r: #f43f5e;
      --r-bg: rgba(244, 63, 94, 0.12);
      --in: #131f38;
      --in-focus: #1c2c4e;
      --bd: rgba(255, 255, 255, 0.08);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      --font-main: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="light"] {
      --bg: #f4f6fa;
      --card: #ffffff;
      --card-elevated: #f8fafc;
      --card-border: #e2e8f0;
      --tx: #0b1f3a;
      --tx-muted: #64748b;
      --tx-dim: #94a3b8;
      --accent: #e11d48;
      --accent-glow: rgba(225, 29, 72, 0.15);
      --accent-grad: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
      --g: #059669;
      --g-bg: #ecfdf5;
      --r: #dc2626;
      --r-bg: #fef2f2;
      --in: #f1f5f9;
      --in-focus: #ffffff;
      --bd: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font-main) !important;
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font-family: var(--font-main);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    /* Animated Splash Screen */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 99999;
      background: #070c18;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }

    .splash-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: splashPop 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .splash-logo-wrap {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .splash-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--accent-grad);
      filter: blur(24px);
      opacity: 0.6;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    .splash-icon {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .splash-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .splash-tagline {
      font-size: 13.5px;
      color: #8e9db5;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin-bottom: 24px;
    }

    .splash-loader {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .splash-bar {
      height: 100%;
      background: var(--accent-grad);
      border-radius: var(--radius-full);
      animation: loadBar 1.2s ease-in-out forwards;
    }

    @keyframes loadBar {
      0% { width: 0%; }
      50% { width: 65%; }
      100% { width: 100%; }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }

    @keyframes splashPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* App Shell */
    #app-shell {
      width: 100%;
      max-width: 580px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.4);
    }

    /* Top App Bar */
    header.app-topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--bd);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--tx);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--card);
      border: 1px solid var(--bd);
      color: var(--tx-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .icon-btn:hover, .icon-btn:active {
      color: var(--tx);
      background: var(--card-elevated);
      border-color: var(--accent);
    }

    /* Main Scrollable View Area */
    main#main-content {
      flex: 1;
      padding: 18px 18px calc(92px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    /* Premium Mobile Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    .card-glow {
      background: radial-gradient(400px circle at top right, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%), var(--card);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--card-border));
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--tx);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--tx-muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .card-action-btn {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--accent);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .card-action-btn:hover {
      background: var(--accent-glow);
    }

    /* Goals Section */
    .goal-box {
      background: var(--in);
      border: 1px solid var(--bd);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-top: 10px;
    }

    .goal-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .goal-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      background: var(--accent-glow);
      color: var(--accent);
    }

    .goal-text {
      font-size: 13.5px;
      color: var(--tx);
      line-height: 1.6;
      white-space: pre-wrap;
      font-weight: 500;
    }

    .goal-empty-text {
      font-size: 13px;
      color: var(--tx-muted);
      font-style: italic;
    }

    .goal-edit-area {
      width: 100%;
      min-height: 75px;
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      color: var(--tx);
      padding: 10px;
      font-family: inherit;
      font-size: 13.5px;
      resize: vertical;
      outline: none;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .kpi-card {
      background: var(--card-elevated);
      border: 1px solid var(--bd);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
    }

    .kpi-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--tx-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .kpi-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--tx);
      margin-top: 4px;
      line-height: 1.2;
    }

    .kpi-val.pos { color: var(--g); }
    .kpi-val.neg { color: var(--r); }

    /* Progress Indicators */
    .progress-wrap {
      margin-top: 10px;
    }

    .progress-bar {
      height: 8px;
      background: var(--in);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin: 6px 0;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-grad);
      border-radius: var(--radius-full);
      transition: width 0.4s ease;
    }

    .progress-fill.green { background: var(--g); }
    .progress-fill.red { background: var(--r); }

    /* Form Controls */
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--bd);
      border-radius: var(--radius-sm);
      background: var(--in);
      color: var(--tx);
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--in-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--tx-muted);
      margin: 10px 0 5px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
    }

    .btn-primary {
      background: var(--accent-grad);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--card-elevated);
      color: var(--tx);
      border: 1px solid var(--bd);
    }

    .btn-pill-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-full);
      background: var(--in);
      border: 1px solid var(--bd);
      color: var(--tx-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* Modern Bottom Navigation Bar */
    nav.app-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 580px;
      margin: 0 auto;
      z-index: 50;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--bd);
      padding: 6px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      justify-content: space-around;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.4);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--tx-muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
      max-width: 72px;
      position: relative;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .nav-icon svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-item.active .nav-icon {
      transform: translateY(-2px);
    }

    .active-dot {
      width: 4px;
      height: 4px;
      border-radius: var(--radius-full);
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      display: none;
      margin-top: 1px;
    }

    .nav-item.active .active-dot {
      display: block;
    }

    /* Floating Center Add Action Button */
    .nav-item-center {
      position: relative;
      top: -14px;
    }

    .fab-btn {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-full);
      background: var(--accent-grad);
      color: #ffffff;
      border: 4px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px var(--accent-glow);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .fab-btn svg {
      width: 24px;
      height: 24px;
      stroke-width: 2.8;
    }

    .fab-btn:active {
      transform: scale(0.92);
    }

    /* Subtabs bar */
    .subtabs {
      display: flex;
      background: var(--in);
      padding: 4px;
      border-radius: var(--radius-md);
      gap: 4px;
      border: 1px solid var(--bd);
    }

    .subtab-btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--tx-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .subtab-btn.active {
      background: var(--card);
      color: var(--tx);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* Trade Item Card */
    .trade-card {
      background: var(--card-elevated);
      border: 1px solid var(--bd);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .trade-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .trade-pair {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--tx);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trade-side-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .side-buy { background: rgba(16, 185, 129, 0.15); color: var(--g); }
    .side-sell { background: rgba(244, 63, 94, 0.15); color: var(--r); }

    .trade-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .trade-pl {
      font-size: 16px;
      font-weight: 800;
    }

    /* Calendar Grid */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .cal-day {
      min-height: 52px;
      border-radius: 8px;
      background: var(--card-elevated);
      border: 1px solid var(--bd);
      padding: 4px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cal-day.w { background: var(--g-bg); border-color: color-mix(in srgb, var(--g) 40%, transparent); }
    .cal-day.l { background: var(--r-bg); border-color: color-mix(in srgb, var(--r) 40%, transparent); }
    .cal-day.today { outline: 2px solid var(--accent); }

    /* Modal Sheet */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 580px;
      background: var(--card);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border-top: 1px solid var(--bd);
      padding: 20px 22px calc(24px + env(safe-area-inset-bottom, 0px));
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-grabber {
      width: 40px;
      height: 4px;
      background: var(--tx-dim);
      border-radius: var(--radius-full);
      margin: 0 auto 16px;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Animated Splash Screen -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <div class="splash-glow"></div>
        <div class="splash-icon">🌸</div>
      </div>
      <h1 class="splash-title">Blossom</h1>
      <p class="splash-tagline">Trade with discipline.</p>
      <div class="splash-loader">
        <div class="splash-bar"></div>
      </div>
    </div>
  </div>

  <div id="app-shell">
    <!-- Top Bar -->
    <header class="app-topbar">
      <div class="topbar-brand">
        <div class="brand-icon">🌸</div>
        <div>
          <h1 class="brand-title">Blossom</h1>
          <div style="font-size:11px;color:var(--tx-muted);font-weight:600">Trading Journal</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggleBtn" title="Toggle Theme">🌓</button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main id="main-content">
      <!-- Injected dynamically by app.js -->
    </main>

    <!-- Premium Mobile Bottom Navigation Bar with SF/Linear Icons -->
    <nav class="app-bottom-nav">
      <!-- 1. Dashboard (Home) -->
      <a class="nav-item active" data-tab="dash">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 3l9 7.5"/>
            <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6a2 2 0 0 1 2-2 2 2 0 0 1 2 2v6h4a1 1 0 0 0 1-1V9.5"/>
          </svg>
        </div>
        <span>Home</span>
        <span class="active-dot"></span>
      </a>

      <!-- 2. Daily Journal -->
      <a class="nav-item" data-tab="jr">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </div>
        <span>Journal</span>
        <span class="active-dot"></span>
      </a>

      <!-- 3. Center Quick Add Button -->
      <div class="nav-item-center">
        <button class="fab-btn" id="openAddTradeModalBtn" title="Log Trade">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- 4. History / Calendar -->
      <a class="nav-item" data-tab="hist">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="3" ry="3"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <span>History</span>
        <span class="active-dot"></span>
      </a>

      <!-- 5. More / Settings -->
      <a class="nav-item" data-tab="more">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"/>
            <line x1="4" y1="10" x2="4" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12" y2="3"/>
            <line x1="20" y1="21" x2="20" y2="16"/>
            <line x1="20" y1="12" x2="20" y2="3"/>
            <line x1="1" y1="14" x2="7" y2="14"/>
            <line x1="9" y1="8" x2="15" y2="8"/>
            <line x1="17" y1="16" x2="23" y2="16"/>
          </svg>
        </div>
        <span>Settings</span>
        <span class="active-dot"></span>
      </a>
    </nav>

    <!-- Add Trade Slide-up Modal -->
    <div id="addTradeModal" class="modal-overlay">
      <div class="modal-sheet">
        <div class="modal-grabber"></div>
        <div class="card-header">
          <h3 class="card-title">✍️ Log a New Trade</h3>
          <button class="card-action-btn" id="closeAddTradeModalBtn">✕ Close</button>
        </div>

        <form id="quickTradeForm">
          <label>Currency Pair / Symbol</label>
          <input type="text" id="qtPair" placeholder="e.g. EURUSD, XAUUSD, NAS100" required autocomplete="off" style="text-transform:uppercase">

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px">
            <div>
              <label>Side</label>
              <div class="btn-pill-group" id="qtSidePills">
                <button type="button" class="pill-btn active" data-val="Buy">🟢 Buy</button>
                <button type="button" class="pill-btn" data-val="Sell">🔴 Sell</button>
              </div>
            </div>
            <div>
              <label>Outcome</label>
              <select id="qtOutcome">
                <option value="Win">Win</option>
                <option value="Loss">Loss</option>
                <option value="Breakeven">Breakeven</option>
              </select>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px">
            <div>
              <label>P/L Amount ($)</label>
              <input type="number" id="qtAmount" placeholder="e.g. 50" step="any" required>
            </div>
            <div>
              <label>Pips (Optional)</label>
              <input type="number" id="qtPips" placeholder="e.g. 25" step="any">
            </div>
          </div>

          <label>Followed Strategy / Plan?</label>
          <div class="btn-pill-group" id="qtFollowedPills">
            <button type="button" class="pill-btn active" data-val="Yes">Yes ✓</button>
            <button type="button" class="pill-btn" data-val="Partly">Partly ⚠️</button>
            <button type="button" class="pill-btn" data-val="No">No ✗</button>
          </div>

          <label>Setup Nuance / Notes</label>
          <textarea id="qtWhy" rows="3" placeholder="Key level retest, confluence, what went well..."></textarea>

          <button type="submit" class="btn btn-primary" style="margin-top:16px">Save Trade Record</button>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
